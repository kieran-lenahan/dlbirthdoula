<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Message sent | Dana Lenahan | Birth Doula</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..600&family=Jost:wght@300;400&display=swap" rel="stylesheet">
<style>
:root{--tide:#3E524A;--abyss:#22403E;--shell:#FBF8F3;--clay:#C4836A;--sand:#E7DFD2}
*{box-sizing:border-box}
body{
  margin:0;min-height:100svh;display:flex;align-items:center;justify-content:center;
  padding:2rem;text-align:center;color:var(--shell);
  font-family:"Jost",sans-serif;font-weight:300;line-height:1.7;
  background:
    radial-gradient(120% 70% at 60% 55%, rgba(255,214,186,.35) 0%, rgba(0,0,0,0) 60%),
    linear-gradient(180deg,#4A5C63 0%,#6E7F82 32%,#3F5B5B 70%,#22403E 100%);
}
.card{max-width:34rem}
h1{font-family:"Fraunces",Georgia,serif;font-weight:400;font-size:clamp(2.2rem,6vw,3.4rem);line-height:1.1;margin:0 0 1.3rem}
h1 em{font-style:italic}
p{opacity:.92;margin:0 0 1.1em}
a.btn{
  display:inline-block;margin-top:1.4rem;text-decoration:none;color:#fff;background:var(--clay);
  border:1px solid var(--clay);padding:.9rem 1.9rem;
  font-size:.82rem;letter-spacing:.17em;text-transform:uppercase;transition:.25s ease;
}
a.btn:hover{background:transparent;color:var(--sand);border-color:var(--sand)}
</style>
</head>
<body>
  <div class="card">
    <h1>Your message is <em>on its way</em>.</h1>
    <p>Thank you for reaching out. I read every message myself and will get back to you soon — usually within a day or two.</p>
    <p>In the meantime, take a breath. You're already doing the work of preparing well.</p>
    <a class="btn" href="/">Back to the site</a>
  </div>
</body>
</html>
