<!doctype html><html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{--abyss:#1F2E29;--tide:#3E524A;--seaglass:#8FAEA4;--sand:#E7DFD2;
        --shell:#FBF8F3;--clay:#C4836A;}
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:1200px;height:630px;overflow:hidden;display:flex;
       font-family:"Jost",sans-serif;background:var(--abyss)}
  .left{flex:0 0 670px;padding:72px 64px;display:flex;flex-direction:column;
        justify-content:center;color:var(--shell);position:relative}
  .eyebrow{font-size:16px;letter-spacing:.34em;text-transform:uppercase;
           color:var(--seaglass);font-weight:400;margin-bottom:30px}
  h1{font-family:"Fraunces",Georgia,serif;font-weight:300;font-size:70px;
     line-height:1.04;letter-spacing:-.015em}
  h1 em{font-style:italic;font-weight:400;color:#F0DCCF}
  .rule{width:76px;height:2px;background:var(--clay);margin:34px 0 28px}
  .name{font-family:"Fraunces",Georgia,serif;font-size:29px;font-weight:400;
        color:var(--shell);letter-spacing:.005em}
  .role{font-size:15px;letter-spacing:.26em;text-transform:uppercase;
        color:var(--seaglass);margin-top:9px}
  .domain{position:absolute;left:64px;bottom:46px;font-size:15px;
          letter-spacing:.2em;text-transform:uppercase;color:rgba(251,248,243,.55)}
  .right{flex:1;position:relative}
  .right img{width:100%;height:100%;object-fit:cover;object-position:56% 32%;display:block}
  .fade{position:absolute;inset:0;
        background:linear-gradient(90deg,var(--abyss) 0%,rgba(31,46,41,.55) 16%,transparent 46%)}
</style></head><body>
  <div class="left">
    <div class="eyebrow">Birth Doula &middot; New Jersey</div>
    <h1>You deserve to feel <em>empowered, loved,</em> and <em>in control.</em></h1>
    <div class="rule"></div>
    <div class="name">Dana Lenahan</div>
    <div class="role">Pregnancy &middot; Birth &middot; Postpartum</div>
    <div class="domain">dlbirthdoula.com</div>
  </div>
  <div class="right"><img src="images/dana.jpg" alt=""><div class="fade"></div></div>
</body></html>
